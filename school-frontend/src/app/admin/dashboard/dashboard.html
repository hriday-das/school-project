<h2 class="text-2xl mb-4">Dashboard</h2>

<!-- LOADING -->
<div *ngIf="isLoading">
  Loading dashboard...
</div>

<!-- CONTENT -->
<div *ngIf="!isLoading">

  <!-- STATS -->
  <div class="grid grid-cols-3 gap-4 mb-6">

    <div class="p-4 bg-blue-500 text-white rounded">
      <h3>Total Students</h3>
      <p class="text-2xl">{{ totalStudents }}</p>
    </div>

    <div class="p-4 bg-green-500 text-white rounded">
      <h3>Active Classes</h3>
      <p class="text-2xl">10</p> <!-- dummy for now -->
    </div>

    <div class="p-4 bg-purple-500 text-white rounded">
      <h3>Total Fees</h3>
      <p class="text-2xl">₹0</p> <!-- future -->
    </div>

  </div>

  <!-- RECENT STUDENTS -->
  <div>
    <h3 class="text-xl mb-2">Recent Students</h3>

    <table class="table-auto w-full border">
      <thead>
        <tr class="bg-gray-200">
          <th>Name</th>
          <th>Class</th>
          <th>Section</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of recentStudents">
          <td>{{ s.name }}</td>
          <td>{{ s.class }}</td>
          <td>{{ s.section || '-' }}</td>
        </tr>

        <tr *ngIf="recentStudents.length === 0">
          <td colspan="3" class="text-center py-3">
            No recent students
          </td>
        </tr>
      </tbody>
    </table>

  </div>

</div>
